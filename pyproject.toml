[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phonehub"
version = "0.2.0"
description = "Desktop control hub for Android and supported iOS device services"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.scripts]
phonehub = "phonehub.app:main"

[tool.setuptools.packages.find]
where = ["src"]
